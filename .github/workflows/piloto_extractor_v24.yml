name: Radar Estado V2.4 - Piloto extractor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  piloto:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-extractor.txt

      - name: Ejecutar piloto aislado
        run: |
          python scripts/extract_funcionarios_detalle.py \
            --limit 5 \
            --delay 3 \
            --retries 1 \
            --output-dir data/enriched/piloto_cloud \
            --reports-dir reports/piloto_cloud

      - name: Guardar reporte del piloto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-estado-v24-piloto
          path: reports/piloto_cloud/
          if-no-files-found: warn
          retention-days: 7
